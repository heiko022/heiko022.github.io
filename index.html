<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heiko's Universe</title>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; overflow-x: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .button { display: block; width: 300px; max-width: 80vw; margin: 12px auto; padding: 20px; background: #333; color: #fff; text-decoration: none; border-radius: 20px; border: 1px solid #555; font-size: 22px; box-sizing: border-box; }
        .button:hover { background: #555; }
        #ufo { font-size: 60px; cursor: pointer; position: relative; }
        #message { font-size: 32px; color: #ff4081; opacity: 0; transition: 1s; }
        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            .button { width: 90vw; max-width: none; padding: 22px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <h1>Heiko's Universe</h1>
    <a href="heizkosten-oelzentralheizung.html" class="button">Heizkosten Oelzentralheizung</a><a href="geburtstag-aliya-nevio/" class="button">Geburtstag Aliya &amp; Nevio</a><a href="nevio-18.html" class="button">Nevio 18</a><a href="aliya-bass.html" class="button">Aliya Bass</a><a href="robot-galaxie.html" class="button">Robot Galaxie</a><a href="jahreskostenkalkulation.html" class="button">Jahreskostenkalkulation</a><a href="driftrace/" class="button">Driftrace</a><a href="yazimoo/" class="button">Yazio Lite</a>
    <div id="ufo" onclick="fly()">🛸</div>
    <div id="message">Liebt euch! ❤️✨</div>
    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        function drawStars() {
            ctx.fillStyle = 'white';
            for(let i=0; i<150; i++) ctx.fillRect(Math.random()*window.innerWidth, Math.random()*window.innerHeight, 1.5, 1.5);
        }
        drawStars();
        function fly() {
            const ufo = document.getElementById('ufo');
            ufo.style.transition = '2s';
            ufo.style.transform = 'translateY(-1000px) rotate(45deg)';
            document.getElementById('message').style.opacity = '1';
        }
    </script>
</body>
</html>
