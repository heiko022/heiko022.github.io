<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Geburtstagsseite für Aliya – Countdown, Orchestermusik, Konfetti und Feuerwerk. Symphony &amp; Celebration.">
<meta name="theme-color" content="#fff8ec">
<title>Aliya | Orchester &amp; Symphonie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #fff8ec;
    --gold: #e6b955;
    --rose: #e88aa8;
    --lila: #a98bd8;
    --ink: #3a2e2a;
    --soft: #ffffff;
  }

  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 12%, rgba(232,138,168,0.22), transparent 50%),
      radial-gradient(circle at 88% 20%, rgba(169,139,216,0.25), transparent 52%),
      radial-gradient(circle at 65% 92%, rgba(230,185,85,0.22), transparent 55%),
      var(--cream);
    color: var(--ink);
    min-height: 100vh;
    padding: 18px 14px 50px;
    overflow-x: hidden;
    position: relative;
  }

  /* Leise schwebende Noten im Hintergrund */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text y='70' font-size='46' fill='rgba(230,185,85,0.5)'>♪</text></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text y='70' font-size='40' fill='rgba(232,138,168,0.5)'>♫</text></svg>");
    background-repeat: repeat;
    background-size: 200px 200px, 230px 240px;
    background-position: 0 0, 110px 90px;
    opacity: 0.5;
    animation: floatNotes 26s ease-in-out infinite alternate;
  }
  @keyframes floatNotes {
    from { transform: translateY(0); }
    to { transform: translateY(-26px); }
  }

  .wrap { position: relative; z-index: 2; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .card {
    background: rgba(255,255,255,0.82);
    border: 0;
    border-radius: 24px;
    padding: 22px 18px;
    box-shadow: 0 10px 32px rgba(58,46,42,0.12);
    backdrop-filter: blur(4px);
    position: relative;
  }

  /* --- Hero --- */
  .hero { text-align: center; overflow: hidden; }
  .hero .kicker {
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--lila);
    margin-bottom: 8px;
  }
  .hero h1 {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(3rem, 18vw, 5rem);
    line-height: 1.05;
    color: #b84a6e;
    text-shadow: 0 2px 0 rgba(255,255,255,0.7), 0 4px 14px rgba(184,74,110,0.35);
    transform: rotate(-1deg);
  }
  .hero .sub {
    margin-top: 22px;
    display: inline-block;
    font-weight: 700;
    font-size: 1.02rem;
    color: #5a4a3f;
    background: rgba(255,255,255,0.75);
    border: 1.5px solid rgba(230,185,85,0.65);
    border-radius: 999px;
    padding: 9px 20px;
    box-shadow: 0 4px 14px rgba(58,46,42,0.10);
  }
  .hero .sub .sep { color: var(--gold); margin: 0 6px; }
  .hero .badge {
    display: inline-block;
    margin-top: 14px;
    font-weight: 700;
    font-size: 0.85rem;
    background: linear-gradient(120deg, var(--gold), #f2cf7d);
    color: #4a3600;
    border-radius: 999px;
    padding: 7px 16px;
    box-shadow: 0 4px 12px rgba(230,185,85,0.5);
  }

  /* --- Orchester --- */
  .orchestra-card { text-align: center; }
  .orchestra svg { width: 100%; max-width: 360px; height: auto; }
  .note-rise { margin-top: 10px; }
  .note-rise span { display: inline-block; margin: 0 5px; font-size: 1.3rem; opacity: 0; }
  .note-rise span.g { animation: rise 2.4s ease-out infinite; }
  .note-rise span.r { animation: rise 2.9s ease-out infinite 0.5s; }
  .note-rise span.l { animation: rise 2.6s ease-out infinite 1s; }
  @keyframes rise {
    0% { transform: translateY(8px); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translateY(-18px); opacity: 0; }
  }
  body.play .note-rise span { animation-play-state: running; }
  body:not(.play) .note-rise span { animation-play-state: paused; }

  /* --- Info (Musikverein) --- */
  .info h2 { font-weight: 700; font-size: 1.15rem; color: var(--rose); margin-bottom: 10px; }
  .info ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .info li { position: relative; padding-left: 30px; line-height: 1.5; font-weight: 600; font-size: 0.95rem; }
  .info li::before { content: "🎼"; position: absolute; left: 0; top: 0; }
  .info li b { color: var(--lila); }
  .info .verein {
    margin-top: 14px;
    background: linear-gradient(120deg, #fff4dd, #ffe9ef);
    border-left: 5px solid var(--gold);
    border-radius: 12px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* --- Countdown --- */
  .cd-title { font-weight: 700; text-align: center; font-size: 0.95rem; letter-spacing: 1px; color: var(--lila); margin-bottom: 14px; }
  .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell {
    background: #fff;
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 12px 2px 9px;
    text-align: center;
  }
  .cell .num { font-weight: 700; font-size: clamp(1.5rem, 8vw, 2.2rem); line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cell.sec .num { color: var(--rose); }
  .cell .lbl { margin-top: 6px; font-size: 0.6rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #b3947a; }
  .zieldatum { text-align: center; font-size: 0.84rem; color: #b3947a; margin-top: 12px; font-weight: 600; }
  .zieldatum b { color: var(--lila); }
  .bar { margin-top: 16px; height: 14px; border-radius: 999px; background: #f0e4d8; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--rose)); transition: width 0.6s ease-out; }
  .plabel { text-align: center; font-size: 0.8rem; color: #b3947a; margin-top: 8px; font-weight: 600; }
  .plabel b { color: var(--ink); }

  /* --- Buttons --- */
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 1rem;
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    color: #fff;
    background: linear-gradient(120deg, var(--lila), var(--rose));
    box-shadow: 0 6px 18px rgba(169,139,216,0.45);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    text-align: center;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn.gold { background: linear-gradient(120deg, var(--gold), #eecf86); color: #4a3600; box-shadow: 0 6px 18px rgba(230,185,85,0.5); }
  .btn.outline { background: #fff; color: var(--lila); box-shadow: inset 0 0 0 2px var(--lila); }
  .btn:active { transform: scale(0.96); }
  .btn.on { box-shadow: 0 0 0 3px #fff, 0 6px 22px rgba(232,138,168,0.8); }

  .hinweis { text-align: center; font-size: 0.78rem; color: #b3947a; }
  .hinweis b { color: var(--rose); }

  /* --- Party --- */
  body.party { animation: partyFlash 0.7s steps(2) infinite; }
  @keyframes partyFlash { 0% { background: var(--cream); } 100% { background: #ffe4f0; } }
  .confetti { position: fixed; top: -24px; width: 10px; height: 16px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(900deg); } }

  /* Feuerwerk (nur am Geburtstag) */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }

  @media (max-width: 380px) {
    .cell .lbl { font-size: 0.52rem; letter-spacing: 0.5px; }
    .card { padding: 16px 14px; }
  }

  /* Bewegungsarme Anzeige respektieren (A11y) */
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    .note-rise span { animation: none; opacity: 0.55; }
    body.party { animation: none; }
    .confetti { display: none; }
    .fill { transition: none; }
    .btn { transition: none; }
  }
</style>

<script>
(() => {
  "use strict";

  // Geburtstag: 03.11.2006 (Monat 0-basiert: 10 = November)
  const GEBURT_TAG = 3, GEBURT_MONAT = 10, GEBURT_JAHR = 2006;

  const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const el = {
    d: document.getElementById('d'), h: document.getElementById('h'),
    m: document.getElementById('m'), s: document.getElementById('s'),
    fill: document.getElementById('fill'), plabel: document.getElementById('plabel'),
    zieldatum: document.getElementById('zieldatum'), cdTitle: document.getElementById('cdTitle'),
    nextAge: document.getElementById('nextAge')
  };
  const pad = n => n < 10 ? '0' + n : '' + n;

  // DOM-Updates nur bei geändertem Inhalt (spart unnötige Layout-Arbeit)
  const labelCache = {};
  const setText = (node, key, text) => {
    if (labelCache[key] !== text) { labelCache[key] = text; node.textContent = text; }
  };
  const setHTML = (node, key, html) => {
    if (labelCache[key] !== html) { labelCache[key] = html; node.innerHTML = html; }
  };

  const naechsterGeburtstag = jetzt => {
    let d = new Date(jetzt.getFullYear(), GEBURT_MONAT, GEBURT_TAG, 0, 0, 0);
    if (d.getTime() <= jetzt.getTime()) d = new Date(jetzt.getFullYear() + 1, GEBURT_MONAT, GEBURT_TAG, 0, 0, 0);
    return d;
  };

  /* ---- Party: Konfetti ---- */
  const startParty = () => {
    if (REDUCED_MOTION) return;
    document.body.classList.add('party');
    const farben = ['#e88aa8', '#f2cf7d', '#a98bd8', '#ffffff'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = (Math.random() * 96) + 'vw';
        c.style.background = farben[Math.floor(Math.random() * farben.length)];
        c.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5200);
      }, i * 55);
    }
  };
  let partyStarted = false;

  /* ---- Feuerwerk (Canvas) ---- */
  const fxCanvas = document.createElement('canvas');
  fxCanvas.id = 'fx';
  document.body.appendChild(fxCanvas);
  const fctx = fxCanvas.getContext('2d');
  let fxW = 0, fxH = 0;
  const fxResize = () => { fxW = fxCanvas.width = window.innerWidth; fxH = fxCanvas.height = window.innerHeight; };
  fxResize();
  window.addEventListener('resize', fxResize);

  const FX_COLORS = ['#ff2bd1', '#00f0ff', '#b6ff3d', '#8a2bff', '#ffd93d', '#ff6b6b', '#ffffff'];
  const rockets = [], fxParticles = [];
  let fxRunning = false, fxTimer = null;

  function launchRocket() {
    const x = fxW * 0.15 + Math.random() * fxW * 0.7;
    const targetY = fxH * 0.12 + Math.random() * fxH * 0.35;
    rockets.push({ x, y: fxH + 12, targetY, vx: (Math.random() - 0.5) * 1.4, vy: -(fxH * 0.018 + Math.random() * fxH * 0.02) });
  }
  function explode(x, y) {
    const n = 42 + Math.floor(Math.random() * 30);
    const hue = FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1.6 + Math.random() * 4.6;
      fxParticles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.008 + Math.random() * 0.012, hue, size: 2 + Math.random() * 2.6 });
    }
  }
  function fxLoop() {
    fctx.clearRect(0, 0, fxW, fxH);
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.12;
      if (r.y <= r.targetY) { explode(r.x, r.y); rockets.splice(i, 1); }
    }
    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.985; p.vy *= 0.985; p.life -= p.decay;
      if (p.life <= 0) { fxParticles.splice(i, 1); continue; }
      fctx.globalAlpha = Math.max(0, p.life);
      fctx.fillStyle = p.hue;
      fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 6.283); fctx.fill();
    }
    fctx.globalAlpha = 1;
    requestAnimationFrame(fxLoop);
  }
  function startFireworks() {
    fxCanvas.style.display = 'block';
    if (!fxRunning) { fxRunning = true; fxLoop(); }
    for (let i = 0; i < 3; i++) setTimeout(launchRocket, i * 220);
    // Bei verstecktem Tab keine neuen Raketen: RAF pausiert dort, sonst stapeln sie sich
    fxTimer = setInterval(() => {
      if (document.hidden) return;
      launchRocket();
      if (Math.random() < 0.5) launchRocket();
    }, 750);
  }

  /* ---- Countdown ---- */
  const tick = () => {
    const jetzt = new Date();
    const istGeburtstag = jetzt.getMonth() === GEBURT_MONAT && jetzt.getDate() === GEBURT_TAG;
    const ziel = istGeburtstag
      ? new Date(jetzt.getFullYear(), GEBURT_MONAT, GEBURT_TAG, 0, 0, 0)
      : naechsterGeburtstag(jetzt);
    const rest = Math.max(0, ziel.getTime() - jetzt.getTime());
    const sek = Math.floor(rest / 1000);
    el.d.textContent = Math.floor(sek / 86400);
    el.h.textContent = pad(Math.floor((sek % 86400) / 3600));
    el.m.textContent = pad(Math.floor((sek % 3600) / 60));
    el.s.textContent = pad(sek % 60);

    const zielAlter = ziel.getFullYear() - GEBURT_JAHR;
    if (istGeburtstag) {
      setText(el.cdTitle, 'cdTitle', `ALLES GUTE ZUM ${zielAlter}. GEBURTSTAG, ALIYA!`);
      setHTML(el.zieldatum, 'ziel', `Heute wird Aliya <b>${zielAlter}</b>! 🎉`);
      setText(el.nextAge, 'nextAge', `HEUTE: ${zielAlter} JAHRE! 🎂`);
    } else {
      setText(el.cdTitle, 'cdTitle', `COUNTDOWN BIS ZUM ${zielAlter}. GEBURTSTAG`);
      setHTML(el.zieldatum, 'ziel', `Dann wird Aliya <b>${zielAlter}</b>!`);
      setText(el.nextAge, 'nextAge', `NÄCHSTER GEBURTSTAG: ${zielAlter} JAHRE`);
    }

    const letzter = new Date(ziel.getFullYear() - 1, GEBURT_MONAT, GEBURT_TAG, 0, 0, 0);
    let pct = (jetzt.getTime() - letzter.getTime()) / (ziel.getTime() - letzter.getTime()) * 100;
    pct = Math.max(0, Math.min(100, pct));
    el.fill.style.width = pct.toFixed(2) + '%';
    setHTML(el.plabel, 'plabel', `Lebensjahr-Fortschritt: <b>${pct.toFixed(1).replace('.', ',')} %</b>`);

    if (istGeburtstag && !partyStarted) {
      partyStarted = true;
      startParty();
      if (!REDUCED_MOTION) startFireworks();
    }
  };
  tick();
  setInterval(tick, 1000);
  // Nach Rückkehr aus Hintergrund-Tab sofort synchronisieren
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  /* ============ Orchester-Synthese (WebAudio, lizenzfrei) ============ */
// Cinematische Orchester-Arrangement in D-Dur (modern, feierlich)
const N = {
  'D5':587.33,'E5':659.25,'F#5':739.99,'G5':783.99,'A5':880.00,
  'B5':987.77,'C6':1046.50,'D6':1174.66,
  'D4':293.66,'A4':440.00,'D3':146.83,'A3':220.00
};

// Cinematische Melodie in D-Dur (feierlich + modern)
const MELODY = [
  ['D4',1],['A4',1],['B4',1],['D5',1.5],['C#5',0.5],['A4',1],['G4',1],['D4',2],
  ['E4',1],['F#4',1],['G4',1],['A4',1.5],['G4',0.5],['F#4',1],['E4',1],['D4',2],
  ['A4',1],['B4',1],['C#5',1],['D5',1.5],['C#5',0.5],['A4',1],['G4',1],['D4',1.5],
  ['E4',0.5],['A4',1.5],['B4',1],['D5',1],['C#5',0.5],['A4',1],['G4',1],['D4',2]
];

// Orchester-Pads (warm, lang, detuned) - Streicher
const PAD_CHORDS = [
  { at: 0,  notes: [293.66, 369.99, 440.00, 587.33], dur: 8 },   // D4 A4 D5 A5 (D-Dur)
  { at: 8,  notes: [261.63, 329.63, 392.00, 523.25], dur: 8 }    // C4 E4 G4 C5 (C-Dur)
];

// Brass-Melodie (Trompeten/Hörner) - fanfareartig
const BRASS_MELODY = [
  ['D4',2],['A4',1],['D5',1],['D5',0.5],['C#5',0.5],['A4',1],['G4',1],['D4',2],
  ['A4',2],['B4',1],['D5',1],['D5',0.5],['C#5',0.5],['A4',1],['G4',1],['D4',2]
];

// Perkussions-Linie (Orchester-Pauken, Becken)
const PERCUSSION = [
  { type: 'timpani', freq: 73.42, beat: 0 },    // D
  { type: 'timpani', freq: 110.00, beat: 4 },   // A
  { type: 'snare', beat: 2 },                    // Snare auf 3
  { type: 'snare', beat: 6 },                    // Snare auf 7
  { type: 'cymbal', beat: 4 },                   // Becken auf A
  { type: 'cymbal', beat: 12 }                   // Großes Becken
];

const quarter = 0.5;  // 120 bpm
const PHRASE_LEN = 8 * quarter;

let ctx = null, master = null, timer = null, playing = false;
const playBtn = document.getElementById('play');

const initAudio = () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!ctx && AC) ctx = new AC();
  if (ctx && ctx.state === 'suspended') ctx.resume();
  return ctx;
};

function startTrack() {
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(ctx.destination);
}
function stopTrack() {
  if (!ctx || !master) return;
  const m = master;
  m.gain.setValueAtTime(m.gain.value, ctx.currentTime);
  m.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
  setTimeout(() => { try { m.disconnect(); } catch(e) {} }, 600);
  master = null;
}

// --- Orchester-Streicher (4-stimmig, detuned) ---
function stringSection(t, freq, dur, vol) {
  const voices = [
    { detune: 0, amp: 0.4, type: 'sine' },
    { detune: 3, amp: 0.3, type: 'triangle' },
    { detune: -3, amp: 0.2, type: 'sawtooth' },
    { detune: 7, amp: 0.1, type: 'triangle' }
  ];
  voices.forEach(v => {
    const o = ctx.createOscillator();
    o.type = v.type;
    o.frequency.value = freq;
    o.detune.value = v.detune;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v.amp * vol, t + 0.3);
    g.gain.setValueAtTime(v.amp * vol, t + dur - 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2500;
    o.connect(f).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  });
}

// --- Brasse-Trompeten (fanfare-artig) ---
function brassFanfare(t, freq, dur, vol) {
  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
  const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = freq * 2;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3000; f.Q.value = 2;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.12 * vol, t + 0.05);
  g.gain.setValueAtTime(0.12 * vol, t + dur - 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(f); o2.connect(f); f.connect(g).connect(master);
  o1.start(t); o1.stop(t + dur + 0.05);
  o2.start(t); o2.stop(t + dur + 0.05);
}

// --- Pauken (Timpani) ---
function timpani(t, freq, vol) {
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol * 0.6, t + 0.05);
  g.gain.setValueAtTime(vol * 0.6, t + 0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.7);
}

// --- Snare-Drum ---
function snare(t, vol) {
  const noise = ctx.createBufferSource();
  const len = Math.floor(ctx.sampleRate * 0.15);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  noise.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  noise.connect(f).connect(g).connect(master);
  noise.start(t); noise.stop(t + 0.15);
}

// --- Becken (Cymbals) ---
function cymbal(t, vol) {
  const noise = ctx.createBufferSource();
  const len = Math.floor(ctx.sampleRate * 2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  noise.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 2);
  noise.connect(f).connect(g).connect(master);
  noise.start(t); noise.stop(t + 2);
}

// --- Streicher-Pad (warm, langanhaltend) ---
function stringPad(t, notes, dur, vol) {
  notes.forEach(n => {
    stringSection(t, n, dur, vol);
  });
}

// --- Sequencer: plant 2 Phrasen (16 Takte) vor ---
function schedulePhrase(at) {
  // 1. Streicher-Pads (warm, unterlegt)
  PAD_CHORDS.forEach(cd => {
    stringPad(at + cd.at, cd.notes, cd.dur, 0.25);
  });
  
  // 2. Brasse-Fanfare (Trompeten oben drüber)
  BRASS_MELODY.forEach(([name, beats]) => {
    if (N[name]) {
      brassFanfare(at, N[name], beats * quarter * 0.95, 0.4);
    }
    at += beats * quarter;
  });
  
  // 3. Hauptmelodie (Violinen)
  let tAcc = 0;
  MELODY.forEach(([name, beats]) => {
    if (N[name]) {
      stringSection(at + tAcc, N[name], beats * quarter * 0.95, 0.35);
    }
    tAcc += beats * quarter;
  });
  
  // 4. Pauken (taktisch)
  PERCUSSION.forEach(p => {
    const t = at + p.beat * quarter;
    if (p.type === 'timpani') {
      timpani(t, p.freq, 0.5);
    } else if (p.type === 'snare') {
      snare(t, 0.35);
    } else if (p.type === 'cymbal') {
      cymbal(t, 0.15);
    }
  });
  
  // 5. Schluss-Trompete (großes Finale)
  brassFanfare(at + PHRASE_LEN - 0.5, 880.00, 1.0, 0.5);
  timpani(at + PHRASE_LEN - 0.3, 110.00, 0.6);
}

// Lookahead-Scheduler
const LOOKAHEAD = PHRASE_LEN * 4;
let nextPhraseAt = 0;
function scheduleAhead() {
  if (!playing || !ctx) return;
  if (nextPhraseAt < ctx.currentTime) nextPhraseAt = ctx.currentTime + 0.08;
  while (nextPhraseAt < ctx.currentTime + LOOKAHEAD) {
    schedulePhrase(nextPhraseAt);
    nextPhraseAt += PHRASE_LEN;
  }
}

playBtn.addEventListener('click', () => {
  if (!initAudio()) { playBtn.textContent = '🔇 Ton nicht verfügbar'; return; }
  if (playing) {
    clearInterval(timer);
    stopTrack();
    playing = false;
    document.body.classList.remove('play');
    playBtn.classList.remove('on');
    playBtn.setAttribute('aria-pressed', 'false');
    playBtn.textContent = '🎻 Orchester starten';
  } else {
    startTrack();
    playing = true;
    nextPhraseAt = 0;
    scheduleAhead();
    timer = setInterval(scheduleAhead, 4000);
    document.body.classList.add('play');
    playBtn.classList.add('on');
    playBtn.setAttribute('aria-pressed', 'true');
    playBtn.textContent = '⏸ Orchester stoppen';
  }
});
})();;
</script>
