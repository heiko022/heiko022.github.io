<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yazimoo</title>
    <style>
        body { font-family: sans-serif; background: #e8f5e9; padding: 20px; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; font-size: 1.1em; border-radius: 5px; margin-bottom: 10px; }
        button { background: #4caf50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🍏 Yazimoo</h1>
    <label>Portionen:</label>
    <select id="persons"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button onclick="loadNewRecipes()">Neue Rezepte laden</button>
    <div id="container"></div>
    <script>
        const pool = [
            { name: "Avocado-Ei-Toast", cal: 300, protein: 12, carbs: 20, fat: 18, ing: ["1 Scheibe Vollkornbrot", "1/2 Avocado", "1 Ei"], steps: "Ei braten, Avocado aufs Brot." },
            { name: "Quinoa-Salat", cal: 380, protein: 14, carbs: 40, fat: 12, ing: ["80g Quinoa", "Tomaten", "Gurke", "Feta"], steps: "Quinoa kochen, Rest schneiden." },
            { name: "Lachsfilet mit Ofengemüse", cal: 500, protein: 38, carbs: 15, fat: 20, ing: ["150g Lachs", "200g Zucchini", "100g Karotten"], steps: "Im Ofen bei 200°C backen." },
            { name: "Griechischer Joghurt mit Nüssen", cal: 280, protein: 15, carbs: 10, fat: 15, ing: ["200g Joghurt", "30g Mandeln"], steps: "Mischen." },
            { name: "Linsensalat", cal: 340, protein: 18, carbs: 45, fat: 6, ing: ["150g Linsen", "Petersilie", "Zwiebel"], steps: "Linsen gar kochen, würzen." },
            { name: "Gemüse-Omelett", cal: 320, protein: 22, carbs: 8, fat: 18, ing: ["2 Eier", "100g Champignons", "Spinat"], steps: "Eier verquirlen, braten." }
        ];

        function scale(ing, p) { return ing.replace(/(\d+)/g, (m) => parseInt(m) * p); }
        
        function loadNewRecipes() {
            const p = parseInt(document.getElementById('persons').value);
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            let html = '<h2>Empfehlungen:</h2>';
            selected.forEach(r => {
                html += `<div class="card"><h3>${r.name}</h3>
                <p><b>Pro Portion:</b> ${r.cal} kcal | <b>Protein:</b> ${r.protein}g | <b>Kohlenhydrate:</b> ${r.carbs}g | <b>Fett:</b> ${r.fat}g</p>
                <p><b>Zutaten (für ${p} Pers.):</b> ${r.ing.map(i => scale(i, p)).join(', ')}</p>
                <p><b>Zubereitung:</b> ${r.steps}</p></div>`;
            });
            document.getElementById('container').innerHTML = html;
        }
        document.getElementById('persons').addEventListener('change', loadNewRecipes);
        loadNewRecipes();
    </script>
</body>
</html>
