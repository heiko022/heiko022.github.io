<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yazimoo</title>
    <style>
        body { font-family: sans-serif; background: #e8f5e9; padding: 20px; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin-bottom: 10px; font-size: 1.1em; }
        button { background: #4caf50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🍏 Yazimoo</h1>
    <select id="persons"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button onclick="loadNewRecipes()">Neue Rezepte laden</button>
    <div id="container"></div>
    <script>
        const allPool = [
            { name: "Lachsfilet mit Ofengemüse", cal: 500, protein: 38, carbs: 15, fat: 20, ing: ["150g Lachsfilet", "200g Zucchini", "100g Karotten", "1EL Öl"], steps: "1. Gemüse würfeln. 2. Mit Lachs auf ein Blech geben. 3. Bei 200°C für 20 Minuten backen." },
            { name: "Hähnchen-Brokkoli", cal: 450, protein: 40, carbs: 10, fat: 12, ing: ["150g Hähnchen", "200g Brokkoli", "1TL Sojasauce"], steps: "1. Hähnchen anbraten. 2. Brokkoli bissfest dünsten. 3. Mit Sojasauce ablöschen." },
            { name: "Kichererbsen-Curry", cal: 420, protein: 18, carbs: 60, fat: 10, ing: ["200g Kichererbsen", "1 Paprika", "100ml Kokosmilch"], steps: "1. Paprika anbraten. 2. Kichererbsen und Kokosmilch dazu. 3. 10 Min. köcheln lassen." },
            { name: "Vollkornpasta Pesto", cal: 480, protein: 15, carbs: 70, fat: 15, ing: ["80g Vollkornnudeln", "1 Zucchini", "2EL Pesto"], steps: "1. Nudeln al dente kochen. 2. Zucchini hobeln. 3. Mit Pesto kurz durchschwenken." },
            { name: "Linsensalat Feta", cal: 390, protein: 20, carbs: 45, fat: 14, ing: ["150g Linsen", "50g Feta", "1 Gurke"], steps: "1. Linsen kochen und abkühlen. 2. Gurke und Feta würfeln. 3. Alles vermengen." }
        ];

        let currentSelection = [];

        function scale(ing, p) { return ing.replace(/(\d+)/g, (m) => parseInt(m) * p); }
        
        function render() {
            const p = parseInt(document.getElementById('persons').value);
            let html = '';
            currentSelection.forEach(r => {
                html += `<div class="card"><h3>${r.name}</h3>
                <p><b>Nährwerte:</b> ${r.cal} kcal | P: ${r.protein}g | KH: ${r.carbs}g | F: ${r.fat}g</p>
                <p><b>Einkaufsliste:</b> ${r.ing.map(i => scale(i, p)).join(', ')}</p>
                <p><b>Zubereitung:</b> ${r.steps}</p></div>`;
            });
            document.getElementById('container').innerHTML = html;
        }

        function loadNewRecipes() {
            const shuffled = [...allPool].sort(() => 0.5 - Math.random());
            currentSelection = shuffled.slice(0, 3);
            render();
        }

        document.getElementById('persons').addEventListener('change', render);
        loadNewRecipes();
    </script>
</body>
</html>
