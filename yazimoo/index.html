<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yazimoo - Lunch Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #e8f5e9; padding: 20px; }
        .card { background: white; padding: 20px; margin: 15px 0; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        select, button { width: 100%; padding: 12px; font-size: 1.1em; border-radius: 8px; margin-bottom: 10px; }
        button { background: #4caf50; color: white; border: none; cursor: pointer; font-weight: bold; }
        .recipe-meta { font-size: 0.9em; color: #555; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🍏 Yazimoo Lunch</h1>
    <label>Portionen:</label>
    <select id="persons"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <button onclick="loadNewRecipes()">Neue Mittagsgerichte laden</button>
    <div id="container"></div>
    <script>
        const pool = [
            { name: "Lachsfilet mit Ofengemüse", cal: 500, protein: 38, carbs: 15, fat: 20, ing: ["150g Lachsfilet", "200g Zucchini", "100g Karotten", "1EL Olivenöl"], steps: "Gemüse würfeln, mit Lachs auf ein Blech geben. Bei 200 Grad für 20 Minuten backen." },
            { name: "Hähnchen-Brokkoli-Pfanne", cal: 450, protein: 40, carbs: 10, fat: 12, ing: ["150g Hähnchenbrust", "200g Brokkoli", "1TL Sojasauce", "1TL Sesamöl"], steps: "Hähnchen anbraten, Brokkoli bissfest dünsten, mit Sauce ablöschen." },
            { name: "Kichererbsen-Gemüse-Curry", cal: 420, protein: 18, carbs: 60, fat: 10, ing: ["200g Kichererbsen", "1 Paprika", "100ml Kokosmilch", "1TL Curry"], steps: "Paprika anbraten, Kichererbsen und Kokosmilch dazu, würzen und köcheln lassen." },
            { name: "Vollkornpasta mit Zucchini-Pesto", cal: 480, protein: 15, carbs: 70, fat: 15, ing: ["80g Vollkornnudeln", "1 Zucchini", "2EL Pesto", "5 Kirschtomaten"], steps: "Nudeln kochen. Zucchini hobeln, kurz mit den Nudeln schwenken, Pesto unterrühren." },
            { name: "Linsensalat mit Feta", cal: 390, protein: 20, carbs: 45, fat: 14, ing: ["150g Linsen", "50g Feta", "1/2 Gurke", "Zitronensaft"], steps: "Linsen kochen, abkühlen lassen. Mit gewürfelter Gurke und Feta mischen, Dressing dazu." }
        ];

        function scale(ing, p) { return ing.replace(/(\d+)/g, (m) => parseInt(m) * p); }
        
        function loadNewRecipes() {
            const p = parseInt(document.getElementById('persons').value);
            const shuffled = [...pool].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            let html = '<h2>Heutige Auswahl:</h2>';
            selected.forEach(r => {
                html += `<div class="card"><h3>${r.name}</h3>
                <div class="recipe-meta"><b>Kalorien:</b> ${r.cal * p} kcal | <b>Protein:</b> ${r.protein * p}g | <b>Kohlenhydrate:</b> ${r.carbs * p}g | <b>Fett:</b> ${r.fat * p}g</div>
                <p><b>Zutaten (für ${p} Pers.):</b> ${r.ing.map(i => scale(i, p)).join(', ')}</p>
                <p><b>Zubereitung:</b> ${r.steps}</p></div>`;
            });
            document.getElementById('container').innerHTML = html;
        }
        document.getElementById('persons').addEventListener('change', loadNewRecipes);
        loadNewRecipes();
    </script>
</body>
</html>
