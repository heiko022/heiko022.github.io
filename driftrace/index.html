<!DOCTYPE html>
<html>
<head>
    <title>Drift Racer - Dirt Track</title>
    <style>
        body { margin: 0; overflow: hidden; background: #5D4037; }
        canvas { display: block; margin: 0 auto; background: #8D6E63; border: 5px solid #3E2723; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let car = { x: 400, y: 300, angle: 0, speed: 0, vel: 0, steer: 0 };
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if (keys['ArrowUp']) car.vel += 0.2;
            if (keys['ArrowDown']) car.vel -= 0.2;
            if (keys['ArrowLeft']) car.steer -= 0.1;
            if (keys['ArrowRight']) car.steer += 0.1;
            
            car.vel *= 0.95; // Friction
            car.steer *= 0.8; // Steering return
            car.angle += car.steer * (car.vel * 0.1);
            car.x += Math.cos(car.angle) * car.vel;
            car.y += Math.sin(car.angle) * car.vel;

            // Bounds
            car.x = Math.max(20, Math.min(canvas.width - 20, car.x));
            car.y = Math.max(20, Math.min(canvas.height - 20, car.y));

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Obstacles
            ctx.fillStyle = '#4E342E';
            ctx.fillRect(200, 100, 50, 200);
            ctx.fillRect(500, 300, 200, 50);

            // Draw Car
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = 'red';
            ctx.fillRect(-15, -10, 30, 20); // Body
            ctx.fillStyle = 'black';
            ctx.fillRect(10, -12, 5, 24);   // Windshield
            ctx.restore();
            
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
