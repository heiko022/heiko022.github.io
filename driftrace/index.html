<!DOCTYPE html>
<html>
<head>
    <title>Drift Racer - Pro Track</title>
    <style>
        body { margin: 0; background: #3e2723; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #6d4c41; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let car = { x: 100, y: 100, angle: 0, speed: 0, accel: 0.15, friction: 0.97, turnSpeed: 0.05 };
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Track path (inner/outer)
        function drawTrack() {
            ctx.strokeStyle = '#2e1e1a';
            ctx.lineWidth = 60;
            ctx.beginPath();
            ctx.moveTo(100, 100); ctx.lineTo(700, 100);
            ctx.lineTo(700, 500); ctx.lineTo(100, 500);
            ctx.closePath();
            ctx.stroke();
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = 50;
            ctx.stroke();
        }

        function update() {
            if (keys['ArrowUp']) car.speed += car.accel;
            if (keys['ArrowDown']) car.speed -= car.accel;
            if (keys['ArrowLeft']) car.angle -= car.turnSpeed * (car.speed !== 0 ? 1 : 0);
            if (keys['ArrowRight']) car.angle += car.turnSpeed * (car.speed !== 0 ? 1 : 0);
            
            car.speed *= car.friction;
            car.x += Math.cos(car.angle) * car.speed;
            car.y += Math.sin(car.angle) * car.speed;

            ctx.clearRect(0, 0, 800, 600);
            drawTrack();

            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            ctx.fillStyle = '#b71c1c';
            ctx.fillRect(-15, -8, 30, 16); // Body
            ctx.fillStyle = '#111';
            ctx.fillRect(-12, -10, 6, 4);   // Wheels
            ctx.fillRect(-12, 6, 6, 4);
            ctx.fillRect(8, -10, 6, 4);
            ctx.fillRect(8, 6, 6, 4);
            ctx.restore();
            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>
