<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Drift Racer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1210; touch-action: none; }
        canvas { display: block; touch-action: none; }
        #overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(5,10,8,0.88); color: #eaffe8; text-align: center; z-index: 20; font-family: system-ui, sans-serif;
        }
        #overlay h1 { font-size: 44px; letter-spacing: 3px; color: #ffb300; text-shadow: 0 0 20px rgba(255,179,0,.6); margin-bottom: 6px; }
        #overlay p { font-size: 15px; opacity: .85; max-width: 460px; line-height: 1.5; margin: 8px auto; padding: 0 16px; }
        #overlay .go { margin-top: 22px; padding: 18px 46px; font-size: 22px; border: none; border-radius: 14px; background: #ffb300; color: #111; font-weight: 700; cursor: pointer; }
        #overlay .go:active { transform: scale(.96); }
        .kbd { display: inline-block; background: #23332b; border: 1px solid #4a5d52; border-radius: 6px; padding: 1px 8px; font-size: 13px; margin: 0 2px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
        <h1>🏎️ DRIFT RACER</h1>
        <p>Fahre auf der Strecke und kombiniere deine Kurven zu Drifts — so schnell du kannst!</p>
        <p><b>Lenkrad</b> links: geben &amp; lenken. <b>Pedale</b> rechts: Gas / Bremse. Am PC: <span class="kbd">↑</span><span class="kbd">W</span> Gas, <span class="kbd">↓</span><span class="kbd">S</span> Bremse, <span class="kbd">←</span><span class="kbd">→</span> / <span class="kbd">A</span><span class="kbd">D</span> Lenken, <span class="kbd">Space</span> Handbremse.</p>
        <button class="go" id="startBtn">LOS GEFAHREN ✨</button>
    </div>
    <script>
    (function () {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let CW, CH;

        /* ---------- World & camera ---------- */
        const WORLD_W = 2400, WORLD_H = 1700;
        let camX = 0, camY = 0, camScale = 0.8;
        let camZoomT = 0.9;

        function resize() {
            CW = window.innerWidth; CH = window.innerHeight;
            canvas.width = CW; canvas.height = CH;
            layout();
            const vs = Math.min(CW / 1150, CH / 1000);
            camScale = Math.max(0.32, Math.min(vs * camZoomT, 1.5));
        }
        window.addEventListener('resize', resize);
        resize();

        /* ---------- Track (Catmull-Rom closed loop) ---------- */
        const ctrl = [
            [600, 1450],[600, 450],[1150, 320],[2100, 450],[2300, 1100],
            [2000, 1500],[1300, 1580],[955, 1500],[1000, 1200],[700, 1110],[750, 1450]
        ];
        const trackHalf = 75;

        function catmull(p0,p1,p2,p3,t){
            const t2=t*t,t3=t2*t;
            return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
        }
        const center = [];       // path points
        const normals = [];      // per-point unit normals
        const cumDist = [0];     // cumulative length
        const N_SEG = 28;
        (function buildTrack() {
            const n = ctrl.length;
            for (let i = 0; i < n; i++) {
                const p0=ctrl[(i-1+n)%n], p1=ctrl[i], p2=ctrl[(i+1)%n], p3=ctrl[(i+2)%n];
                for (let s = 0; s < N_SEG; s++) {
                    const t = s/N_SEG;
                    center.push([catmull(p0[0],p1[0],p2[0],p3[0],t), catmull(p0[1],p1[1],p2[1],p3[1],t)]);
                }
            }
            center.push(center[0].slice());
            for (let i = 0; i < center.length; i++) {
                const a=center[(i-1+center.length)%center.length], b=center[(i+1)%center.length];
                let tx=b[0]-a[0], ty=b[1]-a[1];
                const l=Math.hypot(tx,ty)||1; tx/=l; ty/=l;
                normals.push([-ty, tx]);
                if (i>0) cumDist.push(cumDist[i-1]+Math.hypot(center[i][0]-center[i-1][0], center[i][1]-center[i-1][1]));
            }
        })();
        const N = center.length;

        /* ---------- Nearest track point (fallback: full scan then local) ---------- */
        let hint = 0;
        function nearest(p, hintIdx) {
            const W2 = 120;
            let best = -1, bd = 1e9;
            // local scan around hint
            for (let k = -W2; k <= W2; k++) {
                const i = (hintIdx + k + N) % N;
                const dx=p[0]-center[i][0], dy=p[1]-center[i][1];
                const d=dx*dx+dy*dy;
                if (d<bd) { bd=d; best=i; }
            }
            if (bd < 900*900) return best;
            for (let i = 0; i < N; i++) {
                const dx=p[0]-center[i][0], dy=p[1]-center[i][1];
                const d=dx*dx+dy*dy;
                if (d<bd) { bd=d; best=i; }
            }
            return best;
        }

        /* ---------- Car physics (drift / slip model) ---------- */
        const car = { x: 600, y: 950, a: -Math.PI/2, vx: 0, vy: 0 };
        const ACCEL=260, BRAKE=340, REV=160, MAXSPD=560;
        const DRAG=0.35, GRIP=1.65, GRASS_DRAG=3.2, GRASS_CAP=240;
        let throttle=0, brake=0, steer=0, handbrake=0;
        let offTrack=0, splash=0;

        // lap tracking
        let bestLap=0, lapTime=0, lastProgress=0, armed=false, lapCount=0, running=false;
        let totalDist=0;

        function progressOf(idx){ return idx / N; }
        function update(dt) {
            dt = Math.min(dt, 0.033);
            const spd = Math.hypot(car.vx, car.vy);

            // heading
            const speedFactor = Math.min(1, spd / 120);
            car.a += steer * (1.1 + speedFactor * 1.5) * dt;

            const H = [Math.cos(car.a), Math.sin(car.a)];
            const nrm = [-Math.sin(car.a), Math.cos(car.a)];

            // decompose velocity along heading / normal
            let vt = car.vx*H[0] + car.vy*H[1];
            let vn = car.vx*nrm[0] + car.vy*nrm[1];

            // steering rotates heading; lateral velocity re-orients relative to new heading:
            // (handled implicitly by recomputing H each frame, but vt/vn now relative to new heading)

            // HANDLING the slip: lateral grip pulls vn toward 0 (tire grip). Handbrake = little grip -> drift.
            const grip = handbrake ? 0.55 : (offTrack ? 0.9 : GRIP);
            vn *= Math.exp(-grip * dt);

            // throttle / brake along heading
            if (throttle > 0) {
                vt += ACCEL * dt;
                // steering while accelerating loosens grip a touch -> more drift
                vn *= Math.exp(-Math.abs(steer) * dt);
            }
            if (brake > 0) {
                if (vt > 0) vt -= BRAKE * dt;
                else vt -= REV * dt;
            }

            // drag
            vt *= Math.exp(-DRAG * dt);

            // rebuild world velocity
            car.vx = H[0]*vt + nrm[0]*vn;
            car.vy = H[1]*vt + nrm[1]*vn;

            const newSpd = Math.hypot(car.vx, car.vy);
            if (newSpd > MAXSPD) {
                const k = MAXSPD / newSpd;
                car.vx *= k; car.vy *= k;
            }
            // grass slowdown
            if (offTrack) {
                const k = Math.exp(-GRASS_DRAG * dt);
                car.vx *= k; car.vy *= k;
                if (newSpd > GRASS_CAP) {
                    const c = GRASS_CAP / newSpd; car.vx*=c; car.vy*=c;
                }
            }

            car.x += car.vx * dt;
            car.y += car.vy * dt;

            /* track / progress / lap */
            const idx = nearest([car.x, car.y], hint);
            hint = idx;
            const pt = center[idx], nm = normals[idx];
            const dx = car.x - pt[0], dy = car.y - pt[1];
            const signedD = dx*nm[0] + dy*nm[1];
            offTrack = Math.abs(signedD) > trackHalf;
            splash = Math.abs(signedD) - trackHalf; // >0 off track

            totalDist += newSpd * dt;

            const prog = progressOf(idx);
            if (running) {
                if (offTrack) flash = Math.max(flash, 0.08);
                lapTime += dt;
                if (prog > 0.6) armed = true;
                if (armed && lastProgress > 0.75 && prog < 0.25) {
                    lapCount++;
                    if (bestLap === 0 || lapTime < bestLap) bestLap = lapTime;
                    lapTime = 0;
                    armed = false;
                    flash = 0.6;
                }
                lastProgress = prog;
            } else {
                lastProgress = prog;
            }

            // drift detection
            const drift = spd > 90 ? Math.abs(vn) / Math.max(spd,1) : 0;
            emitFX(drift, vn, spd);
        }

        /* ---------- FX: skids + smoke ---------- */
        const mx = N=>Math.max(-1,Math.min(1,N));
        let fxTimer = 0;
        function emitFX(drift, vn, spd) {
            fxTimer += 16.7 / 1000;
            const nm = normals[hint];
            const rear = 16, side = 8;
            const off = Math.max(0, splash);
            if (drift > 0.34 || (offTrack && spd > 120)) {
                if (fxTimer > 0.04) {
                    fxTimer = 0;
                    // rear tire positions
                    for (const s of [-1, 1]) {
                        const wx = car.x - H() * rear + nm[0]*side*s;
                        const wy = car.y - Hy() * rear + nm[1]*side*s;
                        skids.push({ x: car.x - H()*rear + nm[0]*side*s, y: car.y - Hy()*rear + nm[1]*side*s, dx: car.vx, dy: car.vy, a: 1 });
                    }
                    smoke.push({ x: car.x - H()*rear, y: car.y - Hy()*rear, r: 6, a: 0.5, v: 40 });
                }
            }
        }
        let Hx_,Hy_;
        function H() { Hx_ = Math.cos(car.a); return Hx_; }
        function Hy() { Hy_ = Math.sin(car.a); return Hy_; }

        const skids = [];
        const smoke = [];
        function updateFX(dt) {
            for (let i = skids.length - 1; i >= 0; i--) { skids[i].a -= dt*0.6; if (skids[i].a<=0) skids.splice(i,1); }
            for (let i = smoke.length - 1; i >= 0; i--) {
                const s = smoke[i];
                s.x += (car.vx + (Math.random()-0.5)*s.v)*dt;
                s.y += (car.vy + (Math.random()-0.5)*s.v)*dt;
                s.r += dt*40; s.a -= dt*0.7;
                if (s.a<=0) smoke.splice(i,1);
            }
            if (skids.length > 900) skids.splice(0, skids.length - 900);
            if (smoke.length > 200) smoke.splice(0, smoke.length - 200);
        }
        let flash = 0;

        /* ---------- input ---------- */
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        // touch / pointer controls
        const pointers = new Map();      // id -> {x,y,zone}
        let wheelActive = false, wheelCx=0, wheelCy=0, wheelR=0;
        let gasActive=false, brakeActive=false;

        /* ---------- Touch-Controls Layout ---------- */
        let gasX=0, gasY=0, brakeX=0, brakeY=0, pedR=0;
        function layout(){
            const m = Math.min(CW, CH);
            pedR = m*0.15;
            // Pedale in den unteren Ecken
            gasX = CW*0.13;  gasY = CH*0.85;
            brakeX = CW*0.87; brakeY = CH*0.85;
            // Lenkrad unten mittig
            wheelCx = CW*0.5; wheelCy = CH*0.90; wheelR = m*0.15;
        }

        function pos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function zoneOf(x, y) {
            if (Math.hypot(x-gasX, y-gasY) <= pedR*1.35) return 'gas';
            if (Math.hypot(x-brakeX, y-brakeY) <= pedR*1.35) return 'brake';
            if (Math.hypot(x-wheelCx, y-wheelCy) <= wheelR*1.3) return 'wheel';
            return null;
        }
        let wheelAngle = 0; // current rendered wheel angle (springs back)
        let steerSm = 0;

        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            const p = pos(e);
            const z = zoneOf(p.x, p.y);
            try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
            pointers.set(e.pointerId, { x: p.x, y: p.y, zone: z });
            if (z === 'gas') gasActive = true;
            if (z === 'brake') brakeActive = true;
            if (z === 'wheel') wheelActive = true;
        });
        canvas.addEventListener('pointermove', e => {
            const p = pos(e);
            const rec = pointers.get(e.pointerId);
            if (rec) { rec.x = p.x; rec.y = p.y; }
        });
        function endPointer(e) {
            const rec = pointers.get(e.pointerId);
            if (!rec) return;
            if (rec.zone === 'wheel') wheelActive = false;
            if (rec.zone === 'gas') gasActive = false;
            if (rec.zone === 'brake') brakeActive = false;
            pointers.delete(e.pointerId);
        }
        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);

        function readInput() {
            // keyboard
            let kThrottle = (keys['ArrowUp']||keys['KeyW']) ? 1 : 0;
            let kBrake = (keys['ArrowDown']||keys['KeyS']) ? 1 : 0;
            let kSteer = ((keys['ArrowLeft']||keys['KeyA']) ? -1 : 0) + ((keys['ArrowRight']||keys['KeyD']) ? 1 : 0);
            const kHand = keys['Space'] ? 1 : 0;

            // pointer: nearest active pointer for wheel
            let wTarget = 0;
            let wp = null;
            for (const rec of pointers.values()) { if (rec.zone==='wheel') { wp = rec; break; } }
            if (wp) {
                const ang = Math.atan2(wp.y - wheelCy, wp.x - wheelCx);
                let d = ang - (-Math.PI/2);                 // relative to straight up (12 o'clock)
                while (d > Math.PI) d -= 2*Math.PI;
                while (d < -Math.PI) d += 2*Math.PI;
                wTarget = mx(d / 2.6);                      // voller Einschlag bei ~ ±149° (sanft)
            }
            steerSm += (wTarget - steerSm) * 0.2;
            wheelAngle += (wTarget - wheelAngle) * 0.25;

            const useTouch = pointers.size > 0;
            throttle = useTouch ? (gasActive ? 1 : 0) : kThrottle;
            // touch: brake only via pedal; gas+brake not simultaneous
            brake = useTouch ? (brakeActive ? (throttle ? 0 : 1) : 0) : (kBrake ? 1 : (kHand ? 0.0 : 0));
            // touch brake also acts as handbrake-lite when rolling (helps drifts)
            handbrake = useTouch ? (brakeActive ? 1 : 0) : kHand;
            steer = useTouch ? steerSm : kSteer;

            // deadzone
            if (!useTouch) steer = (Math.abs(steer) < 0.05) ? 0 : mx(steer);
            else steer = (Math.abs(steer) < 0.03) ? 0 : mx(steer);
        }

        /* ---------- render ---------- */
        function drawTrackPath(points, width, style) {
            ctx.strokeStyle = style;
            ctx.lineWidth = width;
            ctx.lineJoin = 'round'; ctx.lineCap='round';
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i=1;i<points.length;i++) ctx.lineTo(points[i][0], points[i][1]);
            ctx.closePath();
            ctx.stroke();
        }
        function offsetPath(side){
            const pts=[], k = side===1? trackHalf : -trackHalf;
            for(let i=0;i<N;i++) pts.push([center[i][0]+normals[i][0]*k, center[i][1]+normals[i][1]*k]);
            return pts;
        }
        function drawWorld() {
            // grass
            ctx.fillStyle = '#17351f';
            ctx.fillRect(-400,-400,WORLD_W+800,WORLD_H+800);
            // subtle grass texture
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for(let i=0;i<260;i++){ ctx.fillRect((i*97)%(WORLD_W+800), (i*53)%(WORLD_H+800), 6,6); }
            // track asphalt
            drawTrackPath(center, trackHalf*2, '#3a3f45');
            // white edges
            const L=offsetPath(1), R=offsetPath(-1);
            drawTrackPath(L, 8, '#e8ecef');
            drawTrackPath(R, 8, '#e8ecef');
            // kerbs (red/white) via dashed outer lines
            ctx.setLineDash([26,26]);
            drawTrackPath(offsetPath(1.16), 14, '#ff2d2d');
            drawTrackPath(offsetPath(-1.16), 14, '#ff2d2d');
            drawTrackPath(offsetPath(1.28), 12, '#ffffff');
            drawTrackPath(offsetPath(-1.28), 12, '#ffffff');
            ctx.setLineDash([]);
            // center guideline (subtle)
            drawTrackPath(center, 3, 'rgba(255,255,255,0.12)');
            // start/finish
            drawStart();
        }
        function drawStart(){
            const i0=3, i1=4;
            const p0=center[i0], p1=center[i1];
            const nm=normals[i0];
            const len=trackHalf;
            const step=len/7;
            for(let r=0;r<7;r++){
                const t=(r%2===0);
                ctx.fillStyle = t?'#f4f4f4':'#0a0a0a';
                const bx=p0[0]+nm[0]*(-len+step*r);
                const by=p0[1]+nm[1]*(-len+step*r);
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx+nm[0]*step, by+nm[1]*step);
                ctx.lineTo(bx+nm[0]*step+(p1[0]-p0[0])*1, by+nm[1]*step+(p1[1]-p0[1])*1);
                ctx.lineTo(bx+(p1[0]-p0[0])*1, by+(p1[1]-p0[1])*1);
                ctx.closePath(); ctx.fill();
            }
        }
        function drawCar() {
            const s = 1;
            // shadow
            ctx.save();
            ctx.translate(car.x+6, car.y+6);
            ctx.rotate(car.a);
            ctx.fillStyle='rgba(0,0,0,0.35)';
            ctx.fillRect(-22,-11,44,22);
            ctx.restore();
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.a);
            ctx.fillStyle='#c62828';
            ctx.fillRect(-22,-11,44,22);
            // windshield / details
            ctx.fillStyle='#1b1b1f';
            ctx.fillRect(-20,-9,8,18);
            ctx.fillStyle='#ffd54f';
            ctx.fillRect(-26,-6,5,4); ctx.fillRect(-26,2,5,4); // headlights
            // wheels (dark)
            ctx.fillStyle='#111';
            ctx.fillRect(-24,-13,9,7); ctx.fillRect(-24,6,9,7);
            ctx.fillRect(16,-13,9,7); ctx.fillRect(16,6,9,7);
            ctx.restore();
        }

        function render() {
            // camera
            const look=0.4;
            const tx = car.x + car.vx*look, ty = car.y + car.vy*look;
            camX += (tx-camX)*0.10; camY += (ty-camY)*0.10;
            ctx.setTransform(1,0,0,1,0,0);
            ctx.clearRect(0,0,CW,CH);
            ctx.fillStyle='#0b1210'; ctx.fillRect(0,0,CW,CH);

            ctx.save();
            ctx.translate(CW/2, CH/2);
            ctx.scale(camScale, camScale);
            ctx.translate(-camX, -camY);
            drawWorld();

            // skids
            for (const s of skids) {
                ctx.strokeStyle=`rgba(20,20,20,${s.a*0.55})`;
                ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.dx*0.03, s.y-s.dy*0.03); ctx.stroke();
            }
            // smoke
            for (const s of smoke) {
                ctx.fillStyle=`rgba(220,220,220,${Math.max(0,s.a)})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
            }
            drawCar();
            ctx.restore();

            // HUD (screen space)
            drawHUD();
            // touch controls
            drawControls();
        }

        function drawHUD() {
            const spd = Math.hypot(car.vx, car.vy);
            ctx.setTransform(1,0,0,1,0,0);
            ctx.font = '700 20px system-ui';
            ctx.textAlign='left';
            ctx.fillStyle='rgba(10,18,14,0.55)';
            ctx.fillRect(10,10,180,68);
            ctx.fillStyle='#ffb300';
            ctx.fillText('LAP '+lapCount, 22, 34);
            ctx.fillStyle='#eaffe8';
            ctx.fillText('Runde  ' + (running?fmt(lapTime):'–'), 22, 56);
            ctx.fillText('Best    ' + (bestLap?fmt(bestLap):'–'), 22, 76);
            ctx.textAlign='right';
            ctx.fillStyle='rgba(10,18,14,0.55)';
            ctx.fillRect(CW-150,10,140,44);
            ctx.fillStyle='#fff';
            ctx.fillText(Math.round(spd)+' km/h', CW-20, 40);

            if (flash>0) { ctx.fillStyle=`rgba(255,235,59,${flash})`; ctx.fillRect(0,0,CW,CH); flash-=0.02; }
        }
        function fmt(t){ const s=t|0; return (s<60?s+'s':Math.floor(s/60)+':'+String(s%60).padStart(2,'0'))+' .'+String(Math.floor((t%1)*100)).padStart(2,'0'); }

        function drawControls() {
            const show = pointers.size > 0 || 'ontouchstart' in window;
            if (!show) return;
            ctx.setTransform(1,0,0,1,0,0);
            // ---- steering wheel (bottom-center) ----
            const cx=wheelCx, cy=wheelCy, r=wheelR;
            ctx.beginPath(); ctx.arc(cx,cy,r,0,6.283);
            ctx.fillStyle='rgba(20,24,28,0.6)'; ctx.fill();
            ctx.strokeStyle='rgba(160,180,190,0.5)'; ctx.lineWidth=3; ctx.stroke();
            // spokes
            ctx.save(); ctx.translate(cx,cy); ctx.rotate(wheelAngle);
            ctx.strokeStyle='rgba(160,180,190,0.55)'; ctx.lineWidth=4;
            for (let k=0;k<3;k++) {
                const a=k*(2*Math.PI/3);
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.lineTo(Math.sin(a)*r*0.9, -Math.cos(a)*r*0.9); ctx.stroke();
            }
            // grip dots around rim
            ctx.fillStyle='rgba(255,255,255,0.5)';
            for (let k=0;k<8;k++){ const a=k*(2*Math.PI/8); ctx.beginPath(); ctx.arc(Math.sin(a)*r, -Math.cos(a)*r, 3, 0, 6.28); ctx.fill(); }
            // top marker
            ctx.fillStyle='#ffb300';
            ctx.beginPath(); ctx.arc(0, -r*0.92, 6, 0, 6.28); ctx.fill();
            ctx.restore();
            ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font='600 13px system-ui'; ctx.textAlign='center';
            ctx.fillText('LENKRAD', cx, cy+r+28);

            // ---- pedals: GAS links unten, BREMS rechts unten ----
            const bw = pedR;
            ctx.beginPath(); ctx.arc(gasX, gasY, bw, 0, 6.283);
            ctx.fillStyle = gasActive? 'rgba(76,175,80,0.85)':'rgba(46,125,50,0.6)';
            ctx.shadowColor='#4caf50'; ctx.shadowBlur = gasActive?24:0;
            ctx.fill(); ctx.shadowBlur=0;
            ctx.strokeStyle='rgba(200,240,200,0.6)'; ctx.lineWidth=3; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.font='700 16px system-ui'; ctx.fillText('GAS', gasX, gasY+6);

            ctx.beginPath(); ctx.arc(brakeX, brakeY, bw, 0, 6.283);
            ctx.fillStyle = brakeActive? 'rgba(239,83,80,0.9)':'rgba(183,28,28,0.6)';
            ctx.shadowColor='#ef5350'; ctx.shadowBlur=brakeActive?22:0;
            ctx.fill(); ctx.shadowBlur=0;
            ctx.strokeStyle='rgba(255,190,190,0.6)'; ctx.lineWidth=3; ctx.stroke();
            ctx.fillStyle='#fff'; ctx.fillText('BREMS', brakeX, brakeY+6);
        }

        /* ---------- loop ---------- */
        let last=performance.now();
        function loop(t){
            const dt=(t-last)/1000; last=t;
            readInput();
            update(dt);
            updateFX(dt);
            render();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        // start
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('overlay').style.display='none';
            running=true;
        });
    })();
    </script>
</body>
</html>
